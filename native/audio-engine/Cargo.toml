[package]
name = "clyde-audio-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
cpal = "0.16"
ringbuf = "0.4"
rubato = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading"
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "clyde-audio-engine"
path = "src/main.rs"
